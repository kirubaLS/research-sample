[project]
name = "yaadhum-backend"
version = "0.1.0"
description = "Yaadhum — assessment diagnostics: psychometric interest test + marks engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "psycopg[binary]>=3.2; sys_platform != 'never'",
  "numpy>=1.26",
  "scipy>=1.13",
  "python-multipart>=0.0.9",
  # runtime, not dev: app.ingest.jina calls the embedding API with it
  "httpx>=0.27",
  # base, not the `vision` extra: app.api.books imports app.ingest.book at module scope,
  # so a missing pymupdf stops the whole API from booting rather than degrading one route
  "pymupdf>=1.24",
  # base rather than an extra: the classifier needs it at runtime on every paper. It is
  # imported lazily inside AnthropicJudge, so a missing install fails that one call rather
  # than the whole service -- but it is not optional to the product.
  "anthropic>=0.40",
  # base, not an extra: app.api.books imports app.ingest.hindi_text -> app.ingest.sarvam_ocr
  # at module scope (same reasoning as pymupdf above), so a missing sarvamai stops the
  # whole API from booting rather than degrading just the Hindi upload route.
  "sarvamai>=0.1.32",
  # base, not an extra: a school's marks arrive as a spreadsheet more often than any other
  # way, and a deployment that cannot open one sends them back to typing by hand
  "openpyxl>=3.1",
]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.10", "pyzbar>=0.1.9", "img2pdf>=0.5", "pikepdf>=9"]
storage = ["boto3>=1.35"]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

# Without this, setuptools sees `app` and `migrations` as two top-level packages and
# refuses to build: "Multiple top-level packages discovered in a flat-layout". That fails
# `pip install -e .`, which is exactly what a platform build command runs.
[tool.setuptools]
packages = ["app"]
include-package-data = true

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 is the FastAPI Depends() idiom; it is correct here, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
