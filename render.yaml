# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Two web services and one managed Postgres. Deploy with:
#   Render dashboard -> New -> Blueprint -> point at this repo
#
# ── Read this before you deploy ────────────────────────────────────────────────────────
# Database: Neon, connected as an external Postgres. There is no `databases:` block here.
# Set both URLs as secrets in the dashboard (see YAADHUM_DATABASE_URL below).
#
# Region: neither Render nor Neon has an India region. Render offers Oregon, Ohio,
# Virginia, Frankfurt and Singapore; Neon's nearest is Singapore (ap-southeast-1). Putting
# both in Singapore co-locates them, which is right for testing.
#
# Student answer scripts contain children's handwriting, so where that data RESTS is a
# DPDP Act question rather than a latency one. This stack cannot give Indian residency.
# For testing with synthetic or consented data that is fine. Before a school's real
# scripts go in, move the data tier to ap-south-1 (RDS or a self-hosted Postgres) and the
# bucket to an ap-south-1 / jurisdiction-restricted store.
#
# Never tell a school data stays in India while running on this stack.
# ───────────────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: yaadhum-api
    runtime: python
    region: singapore
    plan: starter                 # free tier sleeps; a sleeping API breaks a live scan
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -e .
    # Migrations run once per deploy, before the new instance takes traffic.
    #
    # preDeployCommand applies ONLY to Blueprint-managed services on a paid instance type.
    # A service created by hand in the dashboard ignores it, the schema is never created,
    # and the first request fails with: relation "school" does not exist. If that is your
    # setup, either run `cd backend && alembic upgrade head` once from the Shell tab, or
    # fold it into the start command:
    #   alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # (fine for one instance; with several, they would race to migrate on every deploy).
    preDeployCommand: alembic upgrade head
    # One worker fits comfortably in starter's 512 MB with numpy and scipy loaded
    # (~150 MB resident each). Raise WEB_CONCURRENCY when you move to a bigger plan.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers ${WEB_CONCURRENCY:-1}
    # Liveness only. A health check that touches the database restarts a healthy process
    # every time the database hiccups.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: YAADHUM_ENVIRONMENT
        value: production
      # Neon POOLED endpoint (the hostname contains "-pooler"). Set in the dashboard.
      - key: YAADHUM_DATABASE_URL
        sync: false
      # Neon DIRECT endpoint (no "-pooler"). Alembic needs it: the locks and session
      # state a migration relies on do not survive PgBouncer transaction pooling.
      - key: YAADHUM_MIGRATION_DATABASE_URL
        sync: false
      # Exact origins. Never '*' — /t/{class_code}/start is unauthenticated by design.
      - key: YAADHUM_CORS_ORIGINS
        value: https://yaadhum-web.onrender.com
      # The operator console (/platform): create schools, issue a principal's key.
      # A SEPARATE secret from any school key -- a principal must never be able to create
      # schools or read another school's credential. Leave it unset and the whole console
      # is off, which is the right default for a deployment that does not need it.
      # Generate with: python -c "import secrets;print(secrets.token_urlsafe(32))"
      - key: YAADHUM_PLATFORM_ADMIN_KEY
        sync: false
      # MUST match this service's own hostname, or every request is rejected with 400.
      # Rename the service and this has to change with it. The health endpoints are exempt
      # by design -- Render probes from inside its network without the public hostname.
      - key: YAADHUM_TRUSTED_HOSTS
        value: yaadhum-api.onrender.com
      - key: YAADHUM_MODEL_HIGH_STAKES
        value: claude-opus-5
      - key: YAADHUM_MODEL_HIGH_VOLUME
        value: claude-haiku-4-5
      # Flip to "s3" once the scanner needs to store pages — with the four S3 secrets
      # below filled in. Leaving it "s3" while they are blank fails at first use.
      - key: YAADHUM_STORAGE_BACKEND
        value: local
      - key: YAADHUM_S3_REGION
        value: ap-south-1
      # Secrets: set these in the Render dashboard, never in the repo.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: YAADHUM_S3_BUCKET
        sync: false
      - key: YAADHUM_S3_ENDPOINT_URL
        sync: false
      - key: YAADHUM_S3_ACCESS_KEY_ID
        sync: false
      - key: YAADHUM_S3_SECRET_ACCESS_KEY
        sync: false
      # Neon's free tier auto-suspends after a few minutes idle. pool_pre_ping absorbs the
      # wake-up, and a small pool keeps well inside the connection ceiling.
      - key: YAADHUM_DB_POOL_SIZE
        value: "3"
      - key: YAADHUM_DB_MAX_OVERFLOW
        value: "2"
      - key: WEB_CONCURRENCY
        value: "1"

  # MUST be `type: web`, not `type: static`. Two of the routes are server-rendered on
  # demand (/t/[classCode] and its test page) because a class code is a runtime value that
  # cannot be pre-rendered. Creating this as a Render Static Site fails the deploy with
  # "Publish directory dist does not exist!" — the build succeeds, then Render looks for
  # static output that a server-rendered app never produces.
  - type: web
    name: yaadhum-web
    runtime: node
    region: singapore
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Next inlines NEXT_PUBLIC_* at BUILD time, so this must be present during the
      # build, not just at runtime. Changing it requires a rebuild, not a restart.
      - key: NEXT_PUBLIC_API_BASE
        value: https://yaadhum-api.onrender.com

# No `databases:` block — Postgres is Neon, wired in through the two secrets above.
