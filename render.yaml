# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Two web services and one managed Postgres. Deploy with:
#   Render dashboard -> New -> Blueprint -> point at this repo
#
# ── Read this before you deploy ────────────────────────────────────────────────────────
# Database: Neon, connected as an external Postgres. There is no `databases:` block here.
# Set both URLs as secrets in the dashboard (see YAADHUM_DATABASE_URL below).
#
# Region: neither Render nor Neon has an India region. Render offers Oregon, Ohio,
# Virginia, Frankfurt and Singapore; Neon's nearest is Singapore (ap-southeast-1). Putting
# both in Singapore co-locates them, which is right for testing.
#
# Student answer scripts are children's handwriting, so it is worth being exact about
# where they rest. The DPDP Act does NOT require personal data to stay in India: it
# permits transfer except to countries the government notifies, and none has been
# notified. Keeping student work in India is a choice about what a school will accept and
# what can honestly be promised a parent -- a good choice, and not a legal minimum.
#
# What the Act does require, for anyone under 18, is verifiable parental consent before
# their data is processed. Every Class X student is under 18. That follows the product
# rather than the region, and student_profile.consent_ref is currently declared and never
# written -- so it is not met here or anywhere else yet.
#
# Never tell a school data stays in India while running on this stack. It does not.
# ───────────────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: yaadhum-api
    runtime: python
    region: singapore
    plan: starter                 # free tier sleeps; a sleeping API breaks a live scan
    rootDir: backend
    # The extras are not optional in production: `vision` carries pymupdf, which the book
    # ingest and the paper pipeline both import, and `storage` carries boto3 for S3.
    # A bare `pip install -e .` builds green and then fails on the first ingest.
    buildCommand: pip install --upgrade pip && pip install -e ".[vision,storage]"
    # NOTE: this native Python runtime cannot install system binaries, so tesseract-ocr is
    # absent and a scanned marks sheet is refused by name rather than read. Everything else
    # works. To have scans read, deploy backend/Dockerfile instead (runtime: docker), which
    # installs it. The app checks for the binary at runtime, so neither choice is a
    # half-working state -- it either reads scans or says it cannot.
    # Migrations run once per deploy, before the new instance takes traffic.
    #
    # preDeployCommand applies ONLY to Blueprint-managed services on a paid instance type.
    # A service created by hand in the dashboard ignores it, the schema is never created,
    # and the first request fails with: relation "school" does not exist. If that is your
    # setup, either run `cd backend && alembic upgrade head` once from the Shell tab, or
    # fold it into the start command:
    #   alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # (fine for one instance; with several, they would race to migrate on every deploy).
    preDeployCommand: alembic upgrade head
    # One worker fits comfortably in starter's 512 MB with numpy and scipy loaded
    # (~150 MB resident each). Raise WEB_CONCURRENCY when you move to a bigger plan.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers ${WEB_CONCURRENCY:-1}
    # Liveness only. A health check that touches the database restarts a healthy process
    # every time the database hiccups.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: YAADHUM_ENVIRONMENT
        value: production
      # Neon POOLED endpoint (the hostname contains "-pooler"). Set in the dashboard.
      - key: YAADHUM_DATABASE_URL
        sync: false
      # Neon DIRECT endpoint (no "-pooler"). Alembic needs it: the locks and session
      # state a migration relies on do not survive PgBouncer transaction pooling.
      - key: YAADHUM_MIGRATION_DATABASE_URL
        sync: false
      # Exact origins. Never '*' — /t/{class_code}/start is unauthenticated by design.
      - key: YAADHUM_CORS_ORIGINS
        value: https://yaadhum-web.onrender.com
      # The operator console (/platform): create schools, issue a principal's key.
      # A SEPARATE secret from any school key -- a principal must never be able to create
      # schools or read another school's credential. Leave it unset and the whole console
      # is off, which is the right default for a deployment that does not need it.
      # Generate with: python -c "import secrets;print(secrets.token_urlsafe(32))"
      - key: YAADHUM_PLATFORM_ADMIN_KEY
        sync: false
      # MUST match this service's own hostname, or every request is rejected with 400.
      # Rename the service and this has to change with it. The health endpoints are exempt
      # by design -- Render probes from inside its network without the public hostname.
      # Embedding provider. Without it the knowledge base answers exact matches only, so
      # three of the four familiarity levels collapse and Competency Tier cannot be
      # derived from the book. Only book content and question stems are sent -- never a
      # student's answer script.
      - key: YAADHUM_JINA_API_KEY
        sync: false
      - key: YAADHUM_TRUSTED_HOSTS
        value: yaadhum-api.onrender.com
      - key: YAADHUM_MODEL_HIGH_STAKES
        value: claude-opus-5
      - key: YAADHUM_MODEL_HIGH_VOLUME
        value: claude-haiku-4-5
      # Scanned pages go in Postgres, in scan_page.content, beside the marks. Neon is the
      # only durable thing this deployment has -- a Render instance has no disk it keeps --
      # so that is where they live, and they last exactly as long as the marks do.
      #
      # The cost is space: Neon's free project is 0.5 GB, which the marks would never
      # approach and photographs will. Watch the storage figure on the Neon dashboard.
      #
      # There are no object-store settings here. app.storage can talk to any S3-compatible
      # service if that day comes, but nothing in the page path calls it today, and
      # leaving four blank variables that look configurable is how somebody fills one in
      # and wonders why nothing changed.
      - key: YAADHUM_STORAGE_BACKEND
        value: local
      # Secrets: set these in the Render dashboard, never in the repo.
      # The prefix is not decoration -- every setting this service reads carries it, and an
      # unprefixed ANTHROPIC_API_KEY is read by nothing. Set here without it, the key would
      # sit in the dashboard looking present while classification refused for want of one.
      - key: YAADHUM_ANTHROPIC_API_KEY
        sync: false
      # What the classifier costs, turnable from the dashboard without a code deploy: the
      # model, how hard it is asked to work, and how much of the book it is shown. Left
      # unset, the values in app/config.py apply. Raise the model for a paper that matters,
      # lower the passages for one that does not, and read the spend the run reports back.
      - key: YAADHUM_MODEL_CLASSIFIER
        value: claude-sonnet-5
      - key: YAADHUM_MODEL_EFFORT
        value: medium
      - key: YAADHUM_CLASSIFIER_EVIDENCE_PASSAGES
        value: "6"
      - key: YAADHUM_CLASSIFIER_EVIDENCE_CHAPTERS
        value: "3"
      # Neon's free tier auto-suspends after a few minutes idle. pool_pre_ping absorbs the
      # wake-up, and a small pool keeps well inside the connection ceiling.
      - key: YAADHUM_DB_POOL_SIZE
        value: "3"
      - key: YAADHUM_DB_MAX_OVERFLOW
        value: "2"
      - key: WEB_CONCURRENCY
        value: "1"

  # A second copy of the SAME app, deployed from the Docker image instead of the native
  # Python runtime, pointed at the SAME Neon database as yaadhum-api above. It exists for
  # exactly one reason: Hindi book ingest needs Tesseract (app.ingest.hindi_text prefers
  # it over Gemini whenever it is available -- local, no network round trip, and the
  # accuracy this needs), which is a system binary the native Python runtime cannot
  # install at all. Rather than move the main API off its own free-tier Python runtime
  # (breaking nothing, but paying for a heavier image on every request the whole app
  # serves), this one service carries the Docker cost alone, only for the admin who is
  # actively loading a Hindi book.
  #
  # Not meant to be reached by the deployed frontend -- there is no NEXT_PUBLIC_API_BASE
  # pointed at it, and its own CORS is left at app/config.py's default (localhost only).
  # Drive it directly: its auto-generated /docs (Swagger UI) against this service's own
  # URL, with the same YAADHUM_PLATFORM_ADMIN_KEY as yaadhum-api, is enough for an
  # infrequent admin task like loading a book -- it does not need its own UI.
  - type: web
    name: yaadhum-hindi-ingest
    runtime: docker
    region: singapore
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # The Dockerfile's own CMD already runs `alembic upgrade head` before uvicorn starts,
    # so no preDeployCommand here -- unlike yaadhum-api's Python runtime, which needs one
    # because pip install alone does not run migrations. Both services migrating the same
    # database on every deploy is a race only if they deploy at the same moment; in
    # practice one is redeployed far more often than the other, and a migration is
    # idempotent regardless.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: YAADHUM_ENVIRONMENT
        value: production
      # Same Neon project as yaadhum-api -- copy the same two secrets from that service's
      # dashboard rather than typing them by hand a second time, so both are always the
      # same database, never two that have drifted apart.
      - key: YAADHUM_DATABASE_URL
        sync: false
      - key: YAADHUM_MIGRATION_DATABASE_URL
        sync: false
      # Same operator key as yaadhum-api -- one credential for both, not a second to keep
      # in sync. Generate with: python -c "import secrets;print(secrets.token_urlsafe(32))"
      - key: YAADHUM_PLATFORM_ADMIN_KEY
        sync: false
      - key: YAADHUM_TRUSTED_HOSTS
        value: yaadhum-hindi-ingest.onrender.com
      # Sarvam is tried FIRST when set, ahead of this service's own local Tesseract --
      # it exists specifically to be the accuracy option (Sarvam Vision 1.5, trained on
      # Indic scripts) and is worth the network dependency for that. Optional: unset,
      # this service still reads Hindi correctly through Tesseract alone.
      - key: YAADHUM_SARVAM_API_KEY
        sync: false
      # Gemini stays configured as the last-resort fallback for any subject this service
      # is asked to load that neither Sarvam nor Tesseract can read (a language with no
      # tesseract-ocr-<lang> package installed and no Sarvam coverage) -- see
      # app.ingest.hindi_text. Optional: Tesseract handles Hindi on its own once
      # tesseract-ocr-hin is in the Dockerfile, which it already is.
      - key: YAADHUM_GEMINI_API_KEY
        sync: false
      - key: YAADHUM_DB_POOL_SIZE
        value: "2"
      - key: YAADHUM_DB_MAX_OVERFLOW
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"

  # MUST be `type: web`, not `type: static`. Two of the routes are server-rendered on
  # demand (/t/[classCode] and its test page) because a class code is a runtime value that
  # cannot be pre-rendered. Creating this as a Render Static Site fails the deploy with
  # "Publish directory dist does not exist!" — the build succeeds, then Render looks for
  # static output that a server-rendered app never produces.
  - type: web
    name: yaadhum-web
    runtime: node
    region: singapore
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Next inlines NEXT_PUBLIC_* at BUILD time, so this must be present during the
      # build, not just at runtime. Changing it requires a rebuild, not a restart.
      - key: NEXT_PUBLIC_API_BASE
        value: https://yaadhum-api.onrender.com

# No `databases:` block — Postgres is Neon, wired in through the two secrets above.
